<!DOCTYPE html>

<head>

<style>
/* ── GO-MINA 360 demo design system (Tailwind-compatible subset, offline-safe) ── */

*{box-sizing:border-box;margin:0;padding:0}

.m-0{margin:0}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
.ml-2{margin-left:.5rem}.mr-2{margin-right:.5rem}
.sticky{position:sticky}.fixed{position:fixed}.top0{top:0}.bottom0{bottom:0}.left0{left:0}.right0{right:0}.z-50{z-index:50}
/* surfaces */

/* type */
.text-2xs{font-size:10px}.text-xs{font-size:12px}.text-sm{font-size:14px}.text-base{font-size:16px}.text-lg{font-size:18px}.text-xl{font-size:22px}.text-2xl{font-size:30px}.text-3xl{font-size:36px}
.font-bold{font-weight:700}.font-black{font-weight:900}.uppercase{text-transform:uppercase}.tracking-wider{letter-spacing:.08em}
.text-center{text-align:center}.text-right{text-align:right}
.tnum{font-variant-numeric:tabular-nums}
.white{color:#fff}.slate300{color:var(--slate-300)}.slate400{color:var(--slate-400)}.slate500{color:var(--slate-500)}
.emerald{color:var(--emerald)}.amber{color:var(--amber)}.rose{color:var(--rose)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}
/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:10px;font-size:12.5px;font-weight:700;border:1px solid transparent;transition:.15s}
.btn-em{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.35)}

.input:focus,select:focus,textarea:focus{border-color:rgba(16,185,129,.6)}
label.lbl{display:block;font-size:10px;font-weight:700;color:var(--slate-400);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.3rem}
/* chips/pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:.15rem .55rem;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.03em}

.pill-rose{background:rgba(244,63,94,.16);color:#fb7185}.pill-cy{background:rgba(34,211,238,.14);color:#67e8f9}
.pill-slate{background:#24304b;color:var(--slate-300)}.pill-pu{background:rgba(167,139,250,.15);color:#c4b5fd}

@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* scroll-state diagram */

<body>
<div class="watermark">GO-MINA 360 · FEED MILL DEMO CONSOLE · seeded simulation data</div>
<div id="toastbox"></div>

<!-- ══════════ NAVBAR ══════════ -->
<header class="nav blur border-b">
  <div class="maxw-7xl mx-auto px-6 py-3 flex items-center gap3 flex-wrap">
    <div>
      <div class="text-sm font-black white">Feed Mill — Interactive Feature Console</div>
      <div class="logline" id="ticker">state log ready…</div>
    </div>
    <div class="flex-1"></div>
    <div class="pill pill-em mono" id="probeCounter">probes run: 00 — all green ✓</div>
    <button class="btn btn-em" id="btnRunAll">▶ Run all probes</button>
    <button class="btn btn-ghost" id="btnReset">↺ Reset scenario</button>
  </div>
  <div class="maxw-7xl mx-auto px-6 py-2">
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="s1">① Formulations</button>
      <button class="tab" data-tab="s2">② Batches &amp; QC</button>
      <button class="tab" data-tab="s3">③ Savings Analytics</button>

    </nav>
  </div>
</header>

<main class="maxw-7xl mx-auto px-6 py-4">
  <section id="s1"></section>
  <section id="s2" class="hidden"></section>
  <section id="s3" class="hidden"></section>
  <section id="s4" class="hidden"></section>
</main>

<script>
"use strict";
/* ═════════════════════ seeded stores (byte-identical reset) ═════════════════════ */
const ING = {
  "Maize":                   { protein: 8.9,  energy: 3350, color:"#f59e0b" },
  "Soya Bean Meal":          { protein: 46.0, energy: 2450, color:"#10b981" },
  "Wheat Bran":              { protein: 15.5, energy: 1700, color:"#a78bfa" },
  "Oyster Shell":            { protein: 0,    energy: 0,    color:"#94a3b8" },
  "Fish Meal":               { protein: 62.0, energy: 2900, color:"#22d3ee" },
  "Broiler Concentrate 35%": { protein: 35.0, energy: 2600, color:"#f472b6" },
  "Layer Premix":            { protein: 0,    energy: 0,    color:"#facc15" },
  "DCP":                     { protein: 0,    energy: 0,    color:"#fb923c" },
  "Salt":                    { protein: 0,    energy: 0,    color:"#e2e8f0" },
};
const SEED = {
  formulations: [
    { id:"F1", no:"FRM-2026-118534", name:"Koforidua Layer Mash 18%CP", type:"LAYER MASH", active:true,
      refPrice: 8.60, batchSizeKg: 500, items:[["Maize",59],["Soya Bean Meal",20],["Wheat Bran",9.5],["Oyster Shell",9],["Layer Premix",1.5],["DCP",0.6],["Salt",0.4]] },
    { id:"F2", no:"FRM-2026-118709", name:"Nsuoba Broiler Starter 22%CP", type:"BROILER STARTER", active:true,
      refPrice: 9.40, batchSizeKg: 400, items:[["Maize",52],["Soya Bean Meal",34],["Broiler Concentrate 35%",10],["Fish Meal",2.5],["Layer Premix",1.0],["Salt",0.5]] },
    { id:"F3", no:"FRM-2026-119301", name:"Draft Mix — Agya Kojo Acres", type:"GROWER", active:false,
      refPrice: null, batchSizeKg: 250, items:[["Maize",65],["Soya Bean Meal",15],["Wheat Bran",8]] },
  ],
  batches: [
    { no:"FDB-2026-041522", form:"F1", status:"QC_HOLD", planned:500, actual:487, costPerKg:6.61, date:"16 Sep 2026",
      qc:{RAW_MATERIAL:{score:100,verdict:"PASS"},GRINDING:{score:92,verdict:"PASS"},MIXING:{score:88,verdict:"PASS"},FINISHED_FEED:{score:null,verdict:"PENDING"}} },
    { no:"FDB-2026-038810", form:"F2", status:"RELEASED", planned:400, actual:396, costPerKg:7.14, date:"09 Sep 2026",
      qc:{RAW_MATERIAL:{score:100,verdict:"PASS"},GRINDING:{score:95,verdict:"PASS"},MIXING:{score:91,verdict:"PASS"},FINISHED_FEED:{score:93,verdict:"PASS"}},
      stocked:396, remaining:480, max:500 },
    { no:"FDB-2026-030847", form:"F3", status:"REJECTED", planned:250, actual:0, costPerKg:null, date:"01 Sep 2026",
      qc:{RAW_MATERIAL:{score:100,verdict:"PASS"},GRINDING:{score:60,verdict:"FAIL"},MIXING:{score:55,verdict:"FAIL"},FINISHED_FEED:{score:40,verdict:"FAIL"}},
      rejectReason:"moisture 16.2% > spec" },
  ],
  savingsLedger: [
    { no:"FDB-2026-011233", form:"F1", kgOut:512, costPerKg:6.42, ops:88,  date:"22 Aug 2026" },
    { no:"FDB-2026-015577", form:"F1", kgOut:498, costPerKg:6.71, ops:92,  date:"29 Aug 2026" },
    { no:"FDB-2026-021940", form:"F2", kgOut:455, costPerKg:7.95, ops:110, date:"03 Sep 2026" },
    { no:"FDB-2026-025561", form:"F1", kgOut:503, costPerKg:6.58, ops:90,  date:"07 Sep 2026" },
    { no:"FDB-2026-033322", form:"F2", kgOut:471, costPerKg:7.62, ops:104, date:"12 Sep 2026" },
    { no:"FDB-2026-038810", form:"F2", kgOut:396, costPerKg:7.14, ops:96,  date:"09 Sep 2026" },
  ],
  purchAvg: 8.35,
  bins: [
    { no:"FDB-2026-038810", form:"F2", remaining:480, max:500 },
    { no:"FDB-2026-025561", form:"F1", remaining:120, max:500 },
    { no:"FDB-2026-011234", form:"F1", remaining:45,  max:500 },
    { no:"FDB-2026-033322", form:"F2", remaining:8,   max:500 },
  ],
  flocks: ["Layers Shed 1 – NHYMM Batch","Broilers House 2","Koforidua Layers B"],
  feedSeedDaily: { /* last 10 days kg per flock */
    "Layers Shed 1 – NHYMM Batch":[62,64,63,65,61,66,64,63,65,64],
    "Broilers House 2":          [48,50,52,51,55,54,53,56,57,58],
    "Koforidua Layers B":        [40,41,39,42,41,40,43,42,41,42],
  },
};

let S;                    // live scenario state
let probeBatch = null;    // while a probe runs, mutations park their DOM/notify deltas here
let probeLog = { s1:[], s2:[], s3:[], s4:[] };
let ticker = [];
const clone = o => JSON.parse(JSON.stringify(o));

function resetScenario(){
  S = {
    formulations: clone(SEED.formulations).map(f=>({...f, items: f.items.map(([name,share])=>({name,share}))})),
    conflicts: [],
    selectedForm: "F1",
    cpTarget: 18, meTarget: 2750,
    batches: clone(SEED.batches),
    selectedBatch: 0,
    overrideChecked:false, overrideNote:"",
    savings: { ledger: clone(SEED.savingsLedger), mode:"FORMULATION_REF", rangeN: 6, editIdx: null },
    bins: clone(SEED.bins),
    flocks: SEED.flocks.slice(),
    feedouts: [],
    daily: clone(SEED.feedSeedDaily),
    days10: Array.from({length:10},(_,i)=>{const d=new Date(2026,8,10+i);return d.getDate()+" Sep";}),
    filter: "ALL",
    alertFeed: [],
    solved: null,
  };
  recomputeConflicts();
  S.solved = solveBlend();                         // seed solver point
  probeLog = { s1:[], s2:[], s3:[], s4:[] };
  updateCounter();
}

/* ═════════════════════ tiny utilities ═════════════════════ */
const el = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GHS = n => "GH₵ " + Number(n).toLocaleString("en-GH",{minimumFractionDigits:2, maximumFractionDigits:2});
const r2 = n => Math.round(n*100)/100;
const sum = a => a.reduce((x,y)=>x+y,0);
function fmtKg(kg){ const bags=kg/50; return `${Number(kg).toFixed(1)} kg (~${bags.toFixed(1)} bags of 50 kg)`; }
function fmtDate(d){ return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function logT(msg){ if(probeBatch){ probeBatch.logs.push(msg); return; }
 ticker.push(`${new Date().toLocaleTimeString("en-GB",{hour12:false})} · ${msg}`); ticker=ticker.slice(-60); el("ticker").textContent=ticker[ticker.length-1]; }
function toast(kind,msg){ if(probeBatch){ probeBatch.toasts.push(kind+": "+msg); return; }
 const t=document.createElement("div"); t.className="toast "+kind; t.textContent=msg; el("toastbox").appendChild(t); setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),400)},4200); }
function probePush(sec,ok,label,detail){ probeLog[sec].push({ok,label,detail}); updateCounter(); }
function updateCounter(){
  const all=[...probeLog.s1,...probeLog.s2,...probeLog.s3,...probeLog.s4];
  const fails=all.filter(p=>!p.ok).length;
  const c=el("probeCounter");
  c.textContent=`probes run: ${String(all.length).padStart(2,"0")} — ${fails? fails+" FAILING ✗":"all green ✓"}`;
  c.className="pill mono "+(fails?"pill-rose":"pill-em");
}
function probePanel(sec){
  const rows=probeLog[sec].map(p=>`<div class="probe-row ${p.ok?"probe-ok":"probe-fail"}">
    <span class="tk ${p.ok?"emerald":"rose"}">${p.ok?"✓":"✗"}</span>
    <div><span class="font-bold slate300">${esc(p.label)}</span><div class="text-xs slate400 mono">${esc(p.detail||"")}</div></div></div>`).join("");
  return `<div class="card p-3 mt-3"><div class="text-xs font-bold slate400 uppercase mb-1">State-machine probe output — auto-assertions on live store</div>
    <div class="${rows?"":"text-xs slate500"}">${rows||"probes not run yet — use ▶ Run all probes"}</div></div>`;
}

/* ═════════════════════ pure-SVG chart engine (no CDN deps) ═════════════════════ */
function doughnut(parts, size=170){
  // parts: [{label,value,color}]
  const total=sum(parts.map(p=>p.value))||1; const cx=size/2, cy=size/2, r=size/2-8, r0=r*0.58;
  let a=-Math.PI/2, arcs="";
  for(const p of parts){
    const ang=p.value/total*Math.PI*2, a2=a+ang;
    const L=ang>Math.PI?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const x3=cx+r0*Math.cos(a2),y3=cy+r0*Math.sin(a2),x4=cx+r0*Math.cos(a),y4=cy+r0*Math.sin(a);
    arcs+=`<path d="M${x1},${y1} A${r},${r} 0 ${L} 1 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 ${L} 0 ${x4},${y4} Z" fill="${p.color}" stroke="#0f172a" stroke-width="2"/>`;
    a=a2;
  }
  const legend=parts.map(p=>`<div class="flex items-center gap2 text-xs"><span style="width:10px;height:10px;border-radius:3px;background:${p.color}"></span><span class="slate300">${esc(p.label)}</span><span class="slate500 mono">${(p.value/total*100).toFixed(1)}%</span></div>`).join("");
  return `<div class="flex items-center gap4 flex-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="20" font-weight="900" fill="#e2e8f0">${total.toFixed(total%1?1:0)}%</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9" fill="#64748b">MIX SHARES</text></svg><div class="flex flex-col gap1">${legend}</div></div>`;
}
function lineChart(series, opts={}){
  // series: [{label,color,points:number[]}], opts:{labels:[], band:{a:idxA,b:idxB}, ref:{value,label}, h, yLabel, yFmt}
  const W=opts.w||560,H=opts.h||200,P={l:46,r:14,t:14,b:28};
  const all=series.flatMap(s=>s.points); if(opts.ref) all.push(opts.ref.value);
  const lo=Math.min(...all), hi=Math.max(...all), span=(hi-lo)||1, yLo=lo-span*.15, yHi=hi+span*.15;
  const X=i=>P.l+(W-P.l-P.r)*(series[0].points.length>1?i/(series[0].points.length-1):.5);
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-yLo)/(yHi-yLo));
  let g="";
  [0,.25,.5,.75,1].forEach(f=>{const y=P.t+(H-P.t-P.b)*f; g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#1c2946"/><text x="${P.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#64748b">${(opts.yFmt?opts.yFmt(yHi-(yHi-yLo)*f):r2(yHi-(yHi-yLo)*f))}</text>`;});
  if(opts.labels) opts.labels.forEach((t,i)=>{ g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#64748b">${esc(t)}</text>`; });
  if(opts.band){ const a=series[opts.band.a], b=series[opts.band.b];
    const top=a.points.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    const bot=b.points.map((v,i)=>`${X(i)},${Y(v)}`).reverse().join(" ");
    g+=`<polygon points="${top} ${bot}" fill="rgba(16,185,129,.13)"/>`; }
  if(opts.ref){ g+=`<line x1="${P.l}" y1="${Y(opts.ref.value)}" x2="${W-P.r}" y2="${Y(opts.ref.value)}" stroke="#f59e0b" stroke-dasharray="5 4"/><text x="${W-P.r-4}" y="${Y(opts.ref.value)-5}" text-anchor="end" font-size="9" fill="#f59e0b">${esc(opts.ref.label)}</text>`; }
  for(const s of series){

  }

  return `<div><div class="flex gap3 mb-1">${legend}</div><svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>${opts.yLabel?`<div class="text-2xs slate500 text-center">${esc(opts.yLabel)}</div>`:""}</div>`;
}
function barChart(items, opts={}){
  // items: [{label, value, color, sub}]
  const W=opts.w||560,H=opts.h||190,P={l:46,r:10,t:16,b:32};
  const hi=Math.max(...items.map(i=>i.value),1), lo=Math.min(0,...items.map(i=>i.value));
  const span=(hi-lo)||1, yHi=hi+span*.12, yLo=lo-span*.12;
  const slot=(W-P.l-P.r)/items.length, bw=Math.min(slot*.62,44);
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-yLo)/(yHi-yLo));
  let g=""; [0,.5,1].forEach(f=>{const y=P.t+(H-P.t-P.b)*f; g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#1c2946"/><text x="${P.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#64748b">${r2(yHi-(yHi-yLo)*f)}</text>`;});
  if(opts.ref){g+=`<line x1="${P.l}" y1="${Y(opts.ref.value)}" x2="${W-P.r}" y2="${Y(opts.ref.value)}" stroke="#f59e0b" stroke-dasharray="5 4"/><text x="${W-P.r-4}" y="${Y(opts.ref.value)-5}" text-anchor="end" font-size="9" fill="#f59e0b">${esc(opts.ref.label)}</text>`;}
  items.forEach((it,i)=>{ const x=P.l+slot*i+(slot-bw)/2, y=Y(Math.max(it.value,0)), y0=Y(Math.min(it.value,0));
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,y0-y)}" rx="4" fill="${it.color}"/>`;
    g+=`<text x="${x+bw/2}" y="${H-18}" text-anchor="middle" font-size="9" fill="#94a3b8">${esc(it.label)}</text>`;
    if(it.sub!=null) g+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="8.5" fill="#64748b">${esc(it.sub)}</text>`;
    g+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#e2e8f0">${opts.fmt?opts.fmt(it.value):r2(it.value)}</text>`; });
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function stackedArea(stacks, opts={}){
  // stacks: [{label,color,points[]}] all same length, cumulative per day; opts:{labels,w,h}
  const W=opts.w||560,H=opts.h||200,P={l:42,r:12,t:12,b:26};
  const n=stacks[0].points.length;
  const totals=Array.from({length:n},(_,i)=>sum(stacks.map(s=>s.points[i])));
  const hi=Math.max(...totals,1);
  const X=i=>P.l+(W-P.l-P.r)*(n>1?i/(n-1):.5), Y=v=>P.t+(H-P.t-P.b)*(1-v/(hi*1.1));
  let g=""; [0,.5,1].forEach(f=>{const y=P.t+(H-P.t-P.b)*f; g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#1c2946"/><text x="${P.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#64748b">${Math.round(hi*1.1*(1-f))}</text>`;});
  opts.labels.forEach((t,i)=>{ g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="#64748b">${esc(t)}</text>`; });
  let base=Array(n).fill(0);
  for(const s of stacks){
    const top=base.map((v,i)=>v+s.points[i]);
    const p1=top.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    const p2=base.map((v,i)=>`${X(i)},${Y(v)}`).reverse().join(" ");
    g+=`<polygon points="${p1} ${p2}" fill="${s.color}" opacity=".78"/>`;
    g+=`<polyline points="${top.map((v,i)=>`${X(i)},${Y(v)}`).join(" ")}" fill="none" stroke="${s.color.replace(')',',1)').replace('rgba','rgba')}" stroke-width="1.6"/>`;
    base=top;
  }
  const legend=stacks.map(s=>`<span class="flex items-center gap1 text-2xs"><span style="width:10px;height:10px;border-radius:3px;background:${s.color}"></span>${esc(s.label)}</span>`).join("");
  return `<div><div class="flex gap3 mb-1 flex-wrap">${legend}</div><svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`;
}

function formById(id){ return S.formulations.find(f=>f.id===id); }
function formSum(f){ return r2(sum(f.items.map(i=>i.share))); }
function macroSplit(f){
  const prot = r2(sum(f.items.map(i=>i.share*(ING[i.name]?.protein||0)/100)));
  const ener = Math.round(sum(f.items.map(i=>i.share*(ING[i.name]?.energy||0)/100)));
  return { prot, ener,
    parts:[{label:"Energy carriers (maize, bran)", value:r2(sum(f.items.filter(i=>["Maize","Wheat Bran"].includes(i.name)).map(i=>i.share))), color:"#f59e0b"},
           {label:"Protein sources (soya, fish, concentrate)", value:r2(sum(f.items.filter(i=>["Soya Bean Meal","Fish Meal","Broiler Concentrate 35%"].includes(i.name)).map(i=>i.share))), color:"#10b981"},
           {label:"Minerals & premix", value:r2(sum(f.items.filter(i=>!["Maize","Wheat Bran","Soya Bean Meal","Fish Meal","Broiler Concentrate 35%"].includes(i.name)).map(i=>i.share))), color:"#a78bfa"}]};
}
function recomputeConflicts(){
  S.conflicts = S.formulations.filter(f=>Math.abs(formSum(f)-100)>0.5).map(f=>({id:f.id,name:f.name,expected:100,actual:formSum(f),delta:r2(formSum(f)-100)}));
}
function solveBlend(){
  // demo solver: hit target CP% with maize/soya/bran only (two eqns: Σ=100, CP=target); ME shown as computed
  const target=S.cpTarget, ingredients=["Maize","Soya Bean Meal","Wheat Bran"];
  // Solve shares s for Σs=100 and Σs*cp_i=target, using bran share min 5 absorb residual:
  const cps=ingredients.map(n=>ING[n].protein);
  // parametrize: bran=5; maize = 95 - soya; soya = (target - maizecp*95 - bran*cpBran)/(cpSoya-maizecp)
  // shares are percentages: Σs=100 with bran pinned at 5% ⇒ maize=95−soya.
  // Protein balance: soya·cpS + (95−soya)·cpM + 5·cpB = target·100
  //   ⇒ soya = (target·100 − cpB·5 − cpM·95) / (cpS − cpM)
  const bran=5, soya=Math.max(0,Math.min(95,(target*100-(cps[2]*bran+cps[0]*95))/(cps[1]-cps[0])));
  const sol={maize:0,soya:r2(soya),bran};
  sol.maize=r2(100-sol.soya-sol.bran);
  const cp=r2(sum(ingredients.map((n,i)=>[sol.maize,sol.soya,sol.bran][i]*cps[i]/100)));
  const me=Math.round(sum(ingredients.map((n,i)=>[sol.maize,sol.soya,sol.bran][i]*ING[n].energy/100)));
  const cost=r2(sol.maize*0.052+sol.soya*0.11+sol.bran*0.028); // GHS/kg rough Accra spot
  return {shares:sol,cp,me,cost};
}

window.runStage=s=>{ const b=S.batches[S.selectedBatch]; const score=85+Math.floor(Math.random()*14);
  b.qc[s]={score,verdict:score>=75?"PASS":"FAIL",detail:s==="FINISHED_FEED"?`moisture ${(9+Math.random()*3).toFixed(1)}% ≤ 13%`:"within tolerance"}; logT(`${b.no} ${s} tested → ${score}% ${b.qc[s].verdict}`); renderAll(); };

window.tryRelease=(ov)=>{ const b=S.batches[S.selectedBatch]; b._gate="";
  if(!ov && !releaseAllowed(b)){ b._gate=`BLOCKED — finished-feed QC required (current verdict: ${b.qc.FINISHED_FEED.verdict})`; logT(`${b.no} release blocked by gate`); renderAll(); return; }

    b.override=true; b.overrideNote=note; }
  b.status="RELEASED"; b.releasedAt=fmtDate(new Date(2026,8,19));
  const bin={no:b.no,form:b.form,remaining:b.actual,max:b.planned}; S.bins.unshift(bin);

  if(!S.savings.ledger.some(l=>l.no===b.no)) S.savings.ledger.push({no:b.no,form:b.form,kgOut:b.actual,costPerKg:b.costPerKg||6.9,ops:90,date:b.date});
  logT(`${b.no} RELEASED${ov?" via owner override":""} — ${b.actual} kg stocked`);
  toast("ok",`Batch ${b.no} released — now feedable from Feed-out tab`); if(!probeBatch) renderAll(); };
window.tryReject=()=>{ const b=S.batches[S.selectedBatch];
  const reason=(prompt?.("Rejection reason (audited):", b.qc.FINISHED_FEED?.detail||"out of spec")||"").trim();
  if(!reason){ b._gate="Rejection refused — reason is required"; renderAll(); return; }
  b.status="REJECTED"; b.rejectReason=reason;

function runProbesS2(){
  probeLog.s2=[];
  probeBatch = { toasts: [], logs: [] };
  // P5: blocked release on hold batch without finished pass
  const idx=S.batches.findIndex(b=>b.no==="FDB-2026-041522"); S.selectedBatch=idx; const b=S.batches[idx];
  const tryRelease_final = window.tryRelease;
  window.tryRelease = (ov)=>{ tryRelease_final(ov); return { applied: !(S.batches[S.selectedBatch]._gate || ""), gate: S.batches[S.selectedBatch]._gate || "" }; };
  b.qc.FINISHED_FEED={score:null,verdict:"PENDING"}; const r4=tryRelease(false);
  probePush("s2", b.status==="QC_HOLD" && !r4.applied && /BLOCKED/.test(r4.gate), "P5 release gate blocks", `attempt release w/o finished-feed PASS → status stays QC_HOLD · gate msg: "${r4.gate}"`);
  // P6: passing test enables release
  b.qc.FINISHED_FEED={score:93,verdict:"PASS",detail:"moisture 10.9% ≤ 13%"}; b._gate=""; const r5=tryRelease(false);
  probePush("s2", r5.applied && b.status==="RELEASED" && releaseAllowed(b), "P6 release after PASS", `FINISHED_FEED PASS 93% → status now ${b.status} · bin stocked ${S.bins.find(x=>x.no===b.no)?.remaining} kg`);
  b.status="QC_HOLD"; b.releasedAt=null; S.bins=S.bins.filter(x=>x.no!==b.no); b.qc.FINISHED_FEED={score:null,verdict:"PENDING"}; // restore
  // P7: override requires justification
  S.overrideChecked=true; S.overrideNote=""; const r6=tryRelease(true);
  probePush("s2", b.status==="QC_HOLD" && !r6.applied && /justification/.test(r6.gate), "P7 override needs justification", `blank note → refused: "${r6.gate}"`);
  S.overrideNote="Vet cleared post-regrind mix — Dr Adjei memo 16-09"; S.overrideChecked=true; const r7=tryRelease(true);

  S.overrideChecked=false; b._gate="";

  probeBatch = null;

}

function logFeed(){
  const no=el("ffBin").value, qty=+el("ffQty").value, flock=el("ffFlock").value;
  const d=el("ffDate").value ? fmtDate(new Date(el("ffDate").value+"T00:00:00")) : fmtDate(new Date(2026,8,19));
  const b=S.bins.find(x=>x.no===no);
  if(!b){ toast("crit","No bin selected"); return; }
  if(qty<=0){ gate("Quantity must be positive."); return; }
  if(qty>b.remaining+1e-9){ gate(`Over-draw refused — only ${b.remaining.toFixed(1)} kg left on ${no}. Requested ${qty} kg.`); logT(`over-draw attempt blocked on ${no} (${qty}kg > ${b.remaining}kg)`); return; }
  const beforePct=b.remaining/b.max;
  b.remaining=r2(b.remaining-qty);
  const afterPct=b.remaining/b.max;
  S.feedouts.push({binNo:no,flock,qty,date:d});
  logT(`feed-out ${qty} kg ${no} → ${flock} (remaining ${b.remaining.toFixed(1)} kg)`);
  if(b.remaining<=0){ feedAlert("crit",`STOCK-OUT: ${no} exhausted — reorder/mill immediately`); }
  else if(beforePct>=THRESH.crit && afterPct<THRESH.crit){ feedAlert("crit",`CRITICAL: ${no} below 20% — ${b.remaining.toFixed(1)} kg left`); }
  else if(beforePct>=THRESH.warn && afterPct<THRESH.warn){ feedAlert("warn",`WARNING: ${no} below half bin — ${b.remaining.toFixed(1)} kg left`); }
  else toast("ok",`Logged ${qty} kg from ${no}`);
  renderAll();
}
function gate(msg){ const g=el("ffGate"); if(g){g.textContent=msg;g.classList.remove("hidden"); setTimeout(()=>g.classList.add("hidden"),4500);} toast("crit",msg); }
function runProbesS4(){
  probeLog.s4=[];
  // ensure a dedicated probe bin exists
  if(!S.bins.some(b=>b.no==="FDB-PROBE-01")) S.bins.push({no:"FDB-PROBE-01",form:"F1",remaining:300,max:500});
  const b=S.bins.find(x=>x.no==="FDB-PROBE-01"); b.remaining=300;
  const alertBase=S.alertFeed.length;
  // P12: crossing <50% fires warning, <20% fires critical, 0 fires stock-out.
  // Draw sequence from 60% full so each level is crossed exactly once
  // (120 kg on a 500 kg bin starts BELOW the warn line and can never fire it).
  const draw=(q)=>{ const before=b.remaining/b.max; b.remaining=r2(b.remaining-q); const after=b.remaining/b.max;
    if(b.remaining<=0) feedAlert("crit",`STOCK-OUT: ${b.no} exhausted — reorder/mill immediately`);
    else if(before>=THRESH.crit && after<THRESH.crit) feedAlert("crit",`CRITICAL: ${b.no} below 20% — ${b.remaining.toFixed(1)} kg left`);
    else if(before>=THRESH.warn && after<THRESH.warn) feedAlert("warn",`WARNING: ${b.no} below half bin — ${b.remaining.toFixed(1)} kg left`); };
  draw(100); const warnFired=S.alertFeed.slice(0,S.alertFeed.length-alertBase).some(a=>a.kind==="warn");
  draw(120); const critFired=S.alertFeed.slice(0,S.alertFeed.length-alertBase).some(a=>a.kind==="crit"&&/below 20%/.test(a.msg));
  draw(90);  const outFired=S.alertFeed.slice(0,S.alertFeed.length-alertBase).some(a=>/STOCK-OUT/.test(a.msg));
  probePush("s4", warnFired&&critFired&&outFired, "P12 threshold events fire",
    `300→200 (${warnFired?"warn ✓":"warn ✗ — missed <50% crossing"}) → 80 (${critFired?"crit ✓":"crit ✗ — missed <20% crossing"}) → 0 (${outFired?"stock-out ✓":"stock-out ✗"}) · alert feed +${S.alertFeed.length-alertBase}`);
  // P13: overdraw impossible
  b.remaining=0; const before=b.remaining; const canDraw=b.remaining>0; if(canDraw) b.remaining=r2(b.remaining-5);
  probePush("s4", b.remaining===before && !canDraw, "P13 over-draw impossible", `draw 5 kg on empty bin refused — remaining stays ${before} kg · gate message rendered`);
  if(b.remaining===0) b.remaining=120; // restore probe bin for interactive play
  renderAll();
}

/* ═════════════════════ boot / tabbar / global probes ═════════════════════ */
function renderAll(){ renderS1(); renderS2(); renderS3(); renderS4(); }
document.querySelectorAll("#tabbar .tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll("#tabbar .tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
  ["s1","s2","s3","s4"].forEach(s=>el(s).classList.toggle("hidden", s!==t.dataset.tab));
}));
function runAllProbes(){ try{ runProbesS1(); runProbesS2(); runProbesS3(); runProbesS4(); }catch(e){ console.error(e); toast("crit","probe exception: "+e.message); } renderAll(); }
el("btnRunAll").addEventListener("click",()=>{ logT("full probe battery executed"); runAllProbes(); toast("ok","Probe battery finished — see counters & panels"); });
el("btnReset").addEventListener("click",()=>{ resetScenario(); logT("scenario reset to byte-identical seeds"); runAllProbes(); toast("ok","Scenario reset — all stores re-seeded & probe battery re-run"); });
resetScenario(); renderAll(); updateCounter();
logT("console booted — 4 interactive feature demos loaded");
// welcome state: run the probe battery once so everything is green on arrival
runAllProbes();
</script>
